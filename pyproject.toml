[project]
name = "asin-1688-roi-tool"
version = "0.1.0"
description = "Amazon ASIN to 1688 procurement candidates and ROI calculator"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["amazon", "1688", "procurement", "roi", "sourcing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "httpx>=0.28,<1.0",
  "openpyxl>=3.1,<4.0",
  "xlsxwriter>=3.2,<4.0",
]

[project.optional-dependencies]
browser = [
  "selenium>=4.26,<5.0",
  "webdriver-manager>=4.0,<5.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]
packaging = ["pyinstaller>=6.0,<7.0"]

[project.scripts]
asin-1688-roi = "asin_1688_roi.cli:main"

[project.gui-scripts]
asin-1688-roi-gui = "asin_1688_roi.gui:main"

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asin_1688_roi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
